<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 주문조회</title>
<meta name="theme-color" content="#15171C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Archivo:wght@600;800&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#EBEDF2; --ink:#15171C; --ink2:#5E6472; --ink3:#9AA0AD;
  --line:#DFE2E9; --accent:#2C49D6; --accent-soft:#E4E9FB; --accent-ink:#FFFFFF;
  --ok:#1C8F63; --ok-soft:#DDF3E8; --warn:#C7791F; --warn-soft:#FBEBD3; --danger:#CC3F38; --danger-soft:#FBE3E1;
  --shadow:0 8px 28px rgba(20,24,40,.10); --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --surface2:#242832; --ink:#EDEFF4; --ink2:#A2A8B5; --ink3:#6C7280;
  --line:#2C313B; --accent:#7C93FF; --accent-soft:#232B4A; --accent-ink:#0B1030;
  --ok:#3DC98F; --ok-soft:#173327; --warn:#E5A04A; --warn-soft:#3A2C16; --danger:#F0665E; --danger-soft:#3A1E1C;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-family:"Archivo","IBM Plex Sans KR",sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px}
.hdr h1{margin:0;font-size:17px;font-weight:700;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.link{cursor:pointer}
.search{display:flex;gap:8px;position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:19;background:var(--bg);padding-bottom:10px}
.in{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--ink3);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--ink2);line-height:1.6}
.meta b{color:var(--ink);font-weight:500}
.item{padding:10px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .nm{font-weight:500}
.item .op{font-size:12.5px;color:var(--ink2)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap;vertical-align:1px;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.danger{background:var(--danger-soft);color:var(--danger)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.delay{margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;white-space:pre-wrap}
.track a{color:var(--accent);text-decoration:none;font-weight:500}
.reply{margin-top:12px}
.reply textarea{width:100%;min-height:150px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);resize:vertical;line-height:1.55}
.reply .tools{display:flex;gap:8px;margin-top:8px;align-items:center}
.msg{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);text-align:center}
.msg.err{color:var(--danger);border-color:var(--danger)}
.login{max-width:380px;margin:60px auto}
.login h1{font-size:22px;margin:0 0 6px}
.login p{color:var(--ink2);margin:0 0 20px}
.login .in{width:100%;margin-bottom:10px}
.login .err{color:var(--danger);font-size:13px;margin:6px 0 0}
details{margin-top:18px}
summary{cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:500}
.art{padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.art .t{font-weight:500} .art .d{color:var(--ink3);font-size:12px;margin-left:6px} .art .x{color:var(--ink2);white-space:pre-wrap;margin-top:2px;max-height:30em;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const API='https://pydxcqfztjogmztvayux.supabase.co/functions/v1/cs-lookup';
const CODE_KEY='cs_code';
// 카페24 품목 상태 코드 → 우리말 (카페24 관리자 표기 기준)
const ST={N00:'입금전',N10:'상품준비중',N20:'배송준비중',N21:'배송대기',N22:'배송보류',N30:'배송중',N40:'배송완료',N50:'구매확정',
  C00:'취소신청',C10:'취소접수',C34:'취소처리중',C40:'취소완료',C47:'취소완료',C48:'취소완료(환불완료)',R00:'반품신청',R10:'반품접수',R30:'반품처리중(수거전)',R34:'반품처리중(환불전)',R40:'반품완료',
  E00:'교환신청',E10:'교환접수',E30:'교환처리중',E40:'교환완료',E41:'교환완료(재배송)'};
const stText=s=>ST[s]||({N:'처리중',C:'취소',R:'반품',E:'교환'}[s[0]]||'')+' ('+s+')';   // 모르는 코드도 원문 코드 대신 그룹명으로
const stClass=s=>s.startsWith('N3')||s.startsWith('N4')||s==='N50'?'ok':s.startsWith('N')?(s==='N22'?'warn':'acc'):'danger';
// ── 답변 문구 — CS 답변 지침(Desktop/클ㄹ드/CS-답변지침.md, 저장소 밖) 말투: "안녕하세요 고객님 :)" → 공감·상황 확인 → 사실(날짜는 게시판 그대로) → 마무리 ♥️. 3~6문장, 이모지 1~3개, 정책·날짜 창작 금지 ──
const 은는=w=>{ const m=w.match(/[가-힣](?=[^가-힣]*$)/); if(!m) return '은(는)'; const c=m[0].charCodeAt(0); return (c-0xAC00)%28?'은':'는'; };   // 마지막 한글 글자 받침으로 (뒤에 괄호·영문이 붙어도)
const clean=n=>n.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();   // (made)·(2 colors) 같은 꼬리표는 답변에서 뺀다
const nm=g=>{ const names=[...new Set(g.map(i=>clean(i.product_name)))]; const opt=g.length===1&&g[0].option?` (${g[0].option.split(',').map(x=>x.split('=').pop().trim()).join(', ')})`:''; return names.join(', ')+opt; };
const when=line=>{ const seg=line.split(' · ').pop().trim(); return (seg.replace(/\s*출고$/,'')||seg)+' 출고 예정'; };   // "9/28 출고"→"9/28 출고 예정", "다음주 중"→"다음주 중 출고 예정"
const R={   // g = 같은 상태(·같은 지연 줄)인 품목 묶음, a = 지연 글 매칭({line})
  pre:g=>`문의주신 ${nm(g)}${은는(nm(g))} 아직 입금 확인 전으로 확인됩니다 😊\n입금 확인되는 대로 바로 상품 준비 시작할게요.`,
  prep:g=>`문의주신 ${nm(g)}${은는(nm(g))} 현재 출고 준비 중으로 확인됩니다 😊\n출고 후에는 보통 1~2일 정도 소요되지만 택배사 사정에 따라 조금 달라질 수 있는 점 참고 부탁드릴게요.`,
  delay:(g,a)=>`문의주신 ${nm(g)}${은는(nm(g))} 현재 입고가 지연되어 ${when(a.line)}으로 확인됩니다.\n입고되는 대로 최대한 빠르게 준비하여 보내드릴 수 있도록 하겠습니다 🙏`,
  delayNoDate:(g,sm)=>`문의주신 ${nm(g)}${은는(nm(g))} 현재 입고가 지연되어 출고가 늦어지고 있어요.${sm&&sm.in_date?`\n${sm.in_date} 입고 예정으로 확인되며, 입고되는 대로 최대한 빠르게 보내드릴 수 있도록 하겠습니다 🙏`:`\n입고 일정이 확인되는 대로 다시 안내드리고, 입고되는 대로 최대한 빠르게 보내드릴 수 있도록 하겠습니다 🙏`}`,
  hold:g=>`문의주신 ${nm(g)}${은는(nm(g))} 현재 배송 보류 상태로 확인됩니다 ㅠㅠ\n확인 후 다시 안내드릴게요.`,
  ship:g=>`문의주신 ${nm(g)}${은는(nm(g))} ${g[0].carrier||'택배'}로 발송 완료되었습니다 😊\n송장번호는 ${g[0].tracking}이며, 보통 발송 후 1~2일 정도 소요되지만 택배사 사정에 따라 조금 달라질 수 있는 점 참고 부탁드릴게요.`,
  done:g=>`문의주신 ${nm(g)}${은는(nm(g))} 배송완료로 확인됩니다 😊\n혹시 상품이 보이지 않으시면 번거로우시겠지만 배송기사님께 한 번 연락해보시는 게 좋을 것 같아요. 연락하실 때 주소와 송장번호${g[0].tracking?`(${g[0].tracking})`:''}를 함께 말씀해주시면 정확한 배송 위치를 안내받으실 수 있습니다.`,
  cancelIng:g=>`문의주신 주문건은 현재 취소 처리 진행 중으로 확인됩니다 😊\n처리 완료되면 다시 안내드릴게요.`,
  cancelDone:g=>`문의주신 주문건은 취소처리 완료된 것으로 확인됩니다 😊\n확인 부탁드릴게요.`,
  retIng:g=>`문의주신 반품건은 정상적으로 접수되었습니다 😊\n기사님께서 연락 후 방문 수거 예정이니 상품 전달 부탁드릴게요 🙏`,
  retRefund:g=>`문의주신 반품건은 상품 수거 확인되어 현재 환불 처리 진행 중으로 확인됩니다 😊\n처리 완료되면 다시 안내드릴게요.`,
  retDone:g=>`문의주신 반품건은 반품 처리 완료된 것으로 확인됩니다 😊\n확인 부탁드릴게요.`,
  exIng:g=>`문의주신 교환건은 정상적으로 접수되었습니다 😊\n기사님께서 연락 후 방문 수거 예정이니 상품 전달 부탁드릴게요 🙏`,
  exDone:g=>`문의주신 교환건은 교환 처리 완료되어 재발송된 것으로 확인됩니다 😊\n확인 부탁드릴게요.`,
  etc:g=>`문의주신 ${nm(g)}${은는(nm(g))} 현재 ${stText(g[0].status)} 상태로 확인됩니다 😊\n처리 완료되면 다시 안내드릴게요.`,
};
function bodyFor(g,a,sm){ const s=g[0].status;
  if(s==='N00') return R.pre(g);
  if(['N10','N20','N21'].includes(s)){
    if(sm&&sm.possible===1) return R.prep(g);                 // 셀메이트: 출고 가능 → 곧 나감
    if(sm&&sm.possible===0) return a?R.delay(g,a):R.delayNoDate(g,sm);   // 셀메이트: 출고 불가 → 게시판 날짜, 없으면 날짜 없이
    return a?R.delay(g,a):R.prep(g); }                         // 셀메이트 미연결 → 게시판만
  if(s==='N22') return R.hold(g);
  if(s==='N30') return R.ship(g);
  if(s==='N40'||s==='N50') return R.done(g);
  if(['C40','C47','C48'].includes(s)) return R.cancelDone(g); if(s[0]==='C') return R.cancelIng(g);
  if(s==='R40') return R.retDone(g); if(s==='R34') return R.retRefund(g); if(s[0]==='R') return R.retIng(g);
  if(s==='E40'||s==='E41') return R.exDone(g); if(s[0]==='E') return R.exIng(g);
  return R.etc(g); }
// 주문 하나 → 답변 하나: 인사 + (상태·지연줄이 같은 품목끼리 묶어 한 단락씩) + 마무리
function replyFor(o,items){
  const groups=new Map();
  for(const {i,art,sm} of items){ const k=i.status+'|'+(art?art.line:'')+'|'+(sm?sm.possible+':'+sm.in_date:''); if(!groups.has(k)) groups.set(k,{g:[],art,sm}); groups.get(k).g.push(i); }
  const isDelay=({g,art,sm})=>['N10','N20','N21'].includes(g[0].status)&&(sm?sm.possible===0:!!art);
  let apologized=false;
  const paras=[...groups.values()].map(gr=>{ const b=bodyFor(gr.g,gr.art,gr.sm); if(isDelay(gr)&&!apologized){ apologized=true; return '기다리고 계셨을 텐데 배송이 늦어져 정말 죄송합니다 ㅠㅠ\n'+b; } return b; });
  const waiting=[...groups.values()].some(({g,art,sm})=>(sm?sm.possible===0:!!art)||g[0].status==='N22');
  return ['안녕하세요 고객님 :)',...paras,waiting?'조금만 양해 부탁드릴게요 고객님 ♥️':'감사합니다 고객님 ♥️'].join('\n\n');
}

const S={code:localStorage.getItem(CODE_KEY)||'',auth:'unknown',err:'',busy:false,q:'',res:null,delays:null,boards:null,sm:null};   // sm: 셀메이트 조회 결과 {items}|{error}|null
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }
async function api(action,body){
  let r; try{ r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-cs-code':S.code||''},body:JSON.stringify({action,...(body||{})})}); }
  catch(e){ throw Object.assign(new Error('연결할 수 없습니다. 인터넷을 확인하세요'),{code:'net'}); }
  const d=await r.json().catch(()=>({error:'응답 오류'}));
  if(r.status===401){ S.auth='bad'; throw Object.assign(new Error('초대코드가 맞지 않습니다'),{code:'unauthorized'}); }
  if(!r.ok||d.error) throw new Error(d.error||('오류 '+r.status));
  return d;
}

// 배송지연 글 매칭: 글의 상품번호가 같거나, 글 제목·본문에 상품명이 있거나, 상품명 안에 글 제목이 있으면
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function delayFor(item){
  const arts=(S.delays&&S.delays.articles)||[]; const pn=norm(item.product_name);
  // 상품명에서 괄호 꼬리표((made)·(2 colors) 등)를 뺀 핵심 이름으로도 찾는다 — 글에는 보통 짧게 적으므로
  const core=norm(item.product_name.replace(/\([^)]*\)/g,' ').trim());
  // 옵션값(컬러=베이지, 사이즈=L → 베이지, L) — 같은 상품이 여러 줄이면 옵션이 맞는 줄을 고른다
  const opts=String(item.option||'').split(',').map(x=>norm(x.split('=').pop())).filter(x=>x.length>=1);
  for(const a of arts){
    const lines=String(a.text||'').split('\n');
    const byNo=a.product_no&&String(a.product_no)===String(item.product_no);
    const k=[pn,core].find(k=>k.length>=4&&(norm(a.title).includes(k)||lines.some(l=>norm(l).includes(k))));
    if(byNo||k||(norm(a.title).length>=4&&pn.includes(norm(a.title)))){
      const cand=k?lines.filter(l=>norm(l).includes(k)):[];
      if(k&&cand.length&&opts.length&&!cand.some(l=>opts.every(o=>norm(l).includes(o)))) continue;   // 이 상품은 있지만 이 옵션은 지연 아님
      const line=(cand.find(l=>opts.every(o=>norm(l).includes(o)))||cand[0]||'').replace(/\s*\|\s*/g,' · ').trim();
      return {title:a.title,text:a.text,line};
    }
  }
  return null;
}
// 셀메이트 품목 찾기: 같은 주문번호 + 같은 옵션(공백 무시). 옵션이 없으면 상품명으로.
const smFor=(o,i)=>{ const list=(S.sm&&S.sm.items)||[]; const on=norm(i.option), pn=norm(i.product_name);
  return list.find(x=>x.order_id===o.order_id&&(on?norm(x.opt)===on&&norm(x.name)===pn:norm(x.name)===pn))||null; };
const trackUrl=i=>`https://search.naver.com/search.naver?query=${encodeURIComponent((i.carrier||'택배')+' '+i.tracking)}`;

function render(){
  const app=$('#app');
  if(!S.code||S.auth==='bad'){ app.innerHTML=`<div class="login"><h1>CS 주문조회</h1><p>초대코드를 넣으면 시작합니다. 한 번만 넣으면 이 기기에 기억됩니다.</p>
    <form data-a="login"><input class="in" id="li-code" value="${esc(S.code)}" placeholder="초대코드" autocomplete="off" autocapitalize="none" inputmode="numeric">
    <button class="btn pri" ${S.busy?'disabled':''} style="width:100%">${S.busy?'확인 중…':'시작'}</button></form>${S.err?`<p class="err">${esc(S.err)}</p>`:''}</div>`; return; }
  const dl=S.delays; const dcount=dl&&dl.articles?dl.articles.length:null;
  let h=`<div class="hdr"><h1>CS 주문조회</h1><span class="pill link" data-a="delays" title="배송지연 글 새로 불러오기">${dl?(dl.error?'⚠ 지연 게시판':`지연 글 ${dcount}개`):'지연 글 불러오는 중…'}</span><span class="pill link" data-a="sm" title="셀메이트 연결 상태">${window.SELLMATE?(S.sm&&S.sm.error?'⚠ 셀메이트: '+esc(S.sm.error):'셀메이트 연결됨'):'셀메이트 미연결'}</span><span class="pill link" data-a="logout">코드 변경</span></div>
  <form class="search" data-a="search"><input class="in" id="q" value="${esc(S.q)}" placeholder="전화번호 · 주문번호 · 주문자 이름" autocomplete="off" autofocus><button class="btn pri" ${S.busy?'disabled':''}>${S.busy?'조회 중…':'조회'}</button></form>
  <p class="hint">상담톡에서 고객 번호를 복사해 붙여넣으세요. 전화번호·이름은 최근 3개월 주문만 나옵니다. 주문번호(예 20260901-0001234)는 기간 제한 없음.</p>`;
  if(S.err) h+=`<div class="msg err">${esc(S.err)}</div>`;
  else if(S.res){
    const os=S.res.orders;
    if(!os.length) h+=`<div class="msg">주문이 없습니다${S.res.kind!=='order_id'?` (${S.res.since} 이후)`:''}. 번호를 다시 확인하거나 주문자 이름으로 찾아보세요.</div>`;
    os.forEach((o,oi)=>{
      h+=`<div class="card"><div class="row"><h3>주문 <span class="num">${esc(o.order_id)}</span></h3><span class="meta">${esc(String(o.order_date).replace('T',' ').slice(0,16))}</span></div>
      <div class="meta">주문자 <b>${esc(o.buyer_name)}</b> ${esc(o.buyer_cellphone)}${o.member_id?` · 회원 ${esc(o.member_id)}`:' · 비회원'} · ${esc(o.payment)} ${o.paid==='T'?'<span class="badge ok">결제완료</span>':'<span class="badge warn">미결제</span>'}<br>
      받는분 <b>${esc(o.receiver.name)}</b> ${esc(o.receiver.cellphone)} · ${esc(o.receiver.address)}${o.receiver.message?`<br>배송메모 「${esc(o.receiver.message)}」`:''}</div>
      <div style="margin-top:8px">`;
      const its=[];
      o.items.forEach(i=>{
        const art=delayFor(i); const st=stText(i.status); const sm=smFor(o,i); const prep=['N00','N10','N20','N21','N22'].includes(i.status);
        const smBadge=sm&&prep&&!sm.sent?(sm.possible===1?`<span class="badge acc">셀메이트 출고가능${sm.stock!=null?` · 재고 ${sm.stock}`:''}</span>`:`<span class="badge danger">셀메이트 출고불가${sm.stock!=null?` · 재고 ${sm.stock}`:''}${sm.in_date?` · ${esc(sm.in_date)} 입고예정`:''}</span>`):'';
        h+=`<div class="item"><div class="nm">${esc(i.product_name)}<span class="badge ${stClass(i.status)}">${esc(st)}</span>${art?'<span class="badge warn">배송지연</span>':''}${smBadge}</div>
        <div class="op">${esc(i.option)}${i.option?' · ':''}${i.qty}개${i.tracking?` · <span class="track">${esc(i.carrier)} <a href="${trackUrl(i)}" target="_blank" rel="noopener">${esc(i.tracking)}</a></span>`:''}</div>
        ${art?`<div class="delay">📌 ${esc(art.title)}${art.line?'\n'+esc(art.line):''}</div>`:''}</div>`;
        its.push({i,art,sm});
      });
      h+=`</div><div class="reply"><textarea id="rp${oi}">${esc(replyFor(o,its))}</textarea><div class="tools"><button class="btn sm pri" data-a="copy" data-i="${oi}">답변 복사</button><span class="hint" style="margin:0">복사해서 상담톡에 붙이면 끝. 필요하면 위에서 고쳐서 복사하세요.</span></div></div></div>`;
    });
  }
  if(dl){
    h+=`<details><summary>배송지연 게시판 ${dl.error?'— 오류':`글 ${dcount}개`}</summary>`;
    if(dl.error) h+=`<div class="msg err" style="margin-top:8px;text-align:left">${esc(dl.error)}</div>`;
    else (dl.articles||[]).forEach(a=>{ h+=`<div class="art"><span class="t">${esc(a.title)}</span><span class="d">${esc(a.date)}</span><div class="x">${esc(a.text)}</div></div>`; });
    h+=`<div style="margin-top:10px"><button class="btn sm" data-a="boards">게시판 번호 찾기</button> <span class="hint" style="margin:0">지연 게시판이 잘못 잡혔을 때 — 번호 확인 후 deploy-cs-lookup.sh 재실행</span></div>`;
    if(S.boards) h+=`<div class="meta" style="margin-top:6px">${S.boards.map(b=>`#${esc(b.board_no)} ${esc(b.name)}`).join(' · ')}</div>`;
    h+=`</details>`;
  }
  h+=`<details id="sm-guide"><summary>셀메이트 연결 설치 (상담원 PC마다 한 번)</summary><div class="meta" style="margin-top:8px;line-height:1.7">
    셀메이트에 로그인해 둔 <b>같은 브라우저</b>에 아래 두 가지를 설치하면, 조회 결과에 셀메이트의 <b>출고가능/출고불가·재고</b>가 같이 뜨고 답변 문구도 그에 맞춰 바뀝니다. 조회만 하고 셀메이트를 바꾸지는 않습니다.<br>
    ① 확장 프로그램 Tampermonkey 설치 — <a href="https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo" target="_blank" rel="noopener">크롬</a> · <a href="https://microsoftedge.microsoft.com/addons/detail/tampermonkey/iikmkjmpaadaobahmlepeloendndfphd" target="_blank" rel="noopener">엣지</a> (크롬은 설치 후 주소창에 chrome://extensions 를 열어 오른쪽 위 <b>개발자 모드</b>를 켜야 동작)<br>
    ② 관리자에게 받은 연결 파일(<b>danarobe-cs-sellmate.user.js</b>) 설치 — 브라우저 오른쪽 위 Tampermonkey 아이콘 → <b>대시보드</b> → <b>유틸리티</b> 탭 → "파일에서 가져오기"로 그 파일 선택 → [설치]<br>
    ③ 이 페이지 새로고침 → 상단에 "셀메이트 연결됨"이 보이면 끝. 셀메이트 로그인이 풀리면 "로그인 필요"로 바뀌니 셀메이트에 다시 로그인만 하면 됩니다.</div></details>`;
  app.innerHTML=h;
}

async function login(){ const code=(($('#li-code')||{}).value||'').trim(); if(!code){ S.err='초대코드를 입력하세요'; render(); return; }
  S.code=code; S.busy=true; S.err=''; render();
  try{ await api('ping'); S.auth='ok'; localStorage.setItem(CODE_KEY,code); S.busy=false; render(); loadDelays(); $('#q')&&$('#q').focus(); }
  catch(e){ S.busy=false; S.err=e.message; if(e.code!=='unauthorized') S.auth='unknown'; render(); } }
async function loadDelays(){ try{ S.delays=await api('delays'); }catch(e){ S.delays={error:e.message}; } render(); }
async function search(){ const q=($('#q').value||'').trim(); S.q=q; if(!q){ S.err='전화번호·주문번호·이름 중 하나를 입력하세요'; S.res=null; render(); return; }
  S.busy=true; S.err=''; render();
  const smP=window.SELLMATE?window.SELLMATE.search(q).then(items=>({items}),e=>({error:e.message||String(e)})):Promise.resolve(null);
  try{ S.res=await api('search',{q}); }catch(e){ S.err=e.message; S.res=null; }
  S.sm=await smP;
  S.busy=false; render(); }
async function copy(i){ const t=$('#rp'+i).value; try{ await navigator.clipboard.writeText(t); toast('복사됐어요'); }catch(e){ $('#rp'+i).select(); document.execCommand('copy'); toast('복사됐어요'); } }

document.addEventListener('click',async e=>{ const b=e.target.closest('[data-a]'); if(!b||b.tagName==='FORM') return; const a=b.dataset.a;
  if(a==='copy') copy(b.dataset.i); else if(a==='delays'){ S.delays=null; render(); loadDelays(); }
  else if(a==='logout'){ localStorage.removeItem(CODE_KEY); S.code=''; S.auth='unknown'; S.res=null; S.err=''; render(); }
  else if(a==='sm'){ const d=$('#sm-guide'); if(d){ d.open=true; d.scrollIntoView({behavior:'smooth'}); } }
  else if(a==='boards'){ try{ S.boards=(await api('boards')).boards; }catch(err){ S.boards=[{board_no:'?',name:err.message}]; } render(); } });
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.dataset.a==='search') search(); else if(e.target.dataset.a==='login') login(); });
render(); if(S.code) loadDelays();
window.addEventListener('sellmate-ready',()=>render());   // 다리 스크립트가 페이지보다 늦게 붙어도 상태 표시 갱신
</script>
</body>
</html>
